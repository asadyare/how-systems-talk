name: ci
on: [push, pull_request]
# Read-only token: these jobs only read the repo, they never write back.
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history, so a secret deleted in a later commit is still found
          persist-credentials: false
      # Official gitleaks image, pinned by version and digest. Open source CLI, so no licence key.
      # --redact keeps any finding's value out of the log.
      - name: gitleaks (git history)
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/repo"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --verbose --exit-code 1
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - name: screenshots carry no EXIF or text metadata
        run: python scripts/check_metadata.py captures
